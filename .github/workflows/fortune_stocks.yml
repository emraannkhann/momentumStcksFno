name: Fortune Stocks 09:45 AM Scanner

on:
  schedule:
    # 03:45 UTC = 09:15 AM IST (Monday through Friday)
    - cron: '45 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz beautifulsoup4

      - name: Execute Fortune Stocks Time-Gated Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python fortuneStocks.py
